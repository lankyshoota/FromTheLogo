<style>
/* Layout: a single binder page — header strip, eight card sleeves stacked, the open sleeve takes the guess; results sheet at the end. */
:root{
  color-scheme: dark;
  --binder:#19141f;
  --page:#221b29;
  --sleeve:#2a2232;
  --line:rgba(239,232,220,.13);
  --text:#efe8dc;
  --muted:#a89dae;
  --gold:#e8b84a;
  --miss:#d9685c;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0}
html,body{background:var(--binder);color:var(--text)}
body{
  font-family:var(--body);font-size:17px;line-height:1.4;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(232,184,74,.08), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px),
    var(--binder);
  min-height:100%;
}
.wrap{max-width:640px;margin:0 auto;padding-top:max(20px, env(safe-area-inset-top,0px));padding-bottom:max(48px, env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
header>div:first-child{min-width:0}
.mark{font-family:var(--display);font-weight:900;font-size:clamp(38px,11vw,64px);line-height:.85;letter-spacing:.01em;margin:0;text-transform:uppercase}
.mark span{background:linear-gradient(100deg,#f3d27a,#e8b84a 40%,#fff3cf 55%,#b8862b);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.score{text-align:right}
.score b{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.score small{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#120d17;cursor:pointer}
.stage canvas{display:block;width:100%;height:200px}
.hud{position:absolute;right:12px;top:10px;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.hud b{font:900 32px/1 var(--display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.hud small{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.hint{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button,.btn{font:600 15px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--text);color:var(--binder);border-color:var(--text)}
.btn.primary{background:var(--gold);color:#22180a;border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

details.how{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.02)}
details.how summary{cursor:pointer;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
details.how p{margin:.6em 0 0;color:var(--muted);max-width:60ch}
.ladder{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ladder span{font:600 11px var(--mono);letter-spacing:.05em;padding:4px 8px;border-radius:4px;text-transform:uppercase}

.page{display:flex;flex-direction:column;gap:10px}
.sleeve{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;padding:10px;border-radius:12px;background:var(--sleeve);border:1px solid var(--line);position:relative;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.sleeve::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.06),transparent 35%)}
.sleeve.active{border-color:var(--gold);background:var(--page);cursor:default}
.sleeve .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.num{font:600 11px var(--mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.prompt{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.05;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
.meta{font-size:15px;color:var(--muted)}
.meta strong{color:var(--text);font-weight:600}

/* cards */
.card{width:84px;aspect-ratio:5/7;max-width:100%;border-radius:7px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:6px;font-family:var(--body)}
.card.empty{border:1.5px dashed var(--line);background:rgba(0,0,0,.18);align-items:center;justify-content:center;color:var(--muted);font:900 26px var(--display)}
.card .tier{font:600 8px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.card .pn{font:900 15px/0.95 var(--display);text-transform:uppercase;word-break:break-word}
.card .pct{font:600 10px var(--mono)}
.card.flip{animation:flip .55s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:perspective(600px) rotateY(90deg) scale(.9)}to{transform:none}}
/* tiers, worst to best: matte copper, brushed silver, gold foil, emerald holo, rainbow refractor, 1 of 1 */
.t-copper{background:radial-gradient(120% 90% at 25% 15%,#c58a62,#9a5e3c 55%,#6f3f25);color:#fff1e6}
.t-silver{background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,rgba(0,0,0,.05) 1px 2px,transparent 2px 4px),linear-gradient(160deg,#f1f3f6,#bcc3cd 48%,#8a929e);color:#1c2029}
.t-gold{background:linear-gradient(150deg,#fff0b8,#f0c45a 30%,#c8902e 62%,#f6d97f);color:#2a1a04}
.t-gold::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 60%);background-size:260% 100%;background-position:130% 0;animation:sweep 3.4s ease-in-out infinite}
.t-emerald{background:linear-gradient(150deg,#0e4a30,#1d9a62 45%,#0b3a25);color:#eafff4}
.t-emerald::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,rgba(130,255,200,.4),rgba(90,200,255,.28),transparent 45%,rgba(210,255,140,.3),transparent 75%);mix-blend-mode:screen;animation:spin 6s linear infinite}
.t-refr{background:linear-gradient(90deg,#ff6b6b,#ffb36e,#ffe66e,#8ff0a4,#6ec6ff,#a48bff,#ff7ad9,#ff6b6b);background-size:200% 100%;animation:rainbow 6s linear infinite;color:#1d1424}
.t-refr::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 2px,transparent 2px 7px),linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.05) 60%);mix-blend-mode:soft-light}
.t-one{background:#0d0b10;color:#f6e3a8;box-shadow:inset 0 0 0 1.5px #e8b84a,0 0 10px rgba(232,184,74,.45);animation:glow 2.6s ease-in-out infinite alternate}
.t-one::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(232,184,74,.4),transparent 30%,rgba(140,200,255,.25),transparent 60%);animation:spin 6s linear infinite}
.card.t-one.flip{animation:flip-one 1.2s cubic-bezier(.2,.8,.2,1),glow 2.6s 1.2s ease-in-out infinite alternate}
@keyframes sweep{from{background-position:130% 0}to{background-position:-60% 0}}
@keyframes rainbow{from{background-position:0 0}to{background-position:-200% 0}}
@keyframes glow{from{box-shadow:inset 0 0 0 1.5px #e8b84a,0 0 6px rgba(232,184,74,.35)}to{box-shadow:inset 0 0 0 1.5px #ffe7a0,0 0 18px rgba(232,184,74,.8)}}
@keyframes flip-one{0%{transform:perspective(600px) rotateY(540deg) scale(.5);filter:brightness(2.4)}55%{transform:perspective(600px) rotateY(-14deg) scale(1.15);filter:brightness(1.4)}100%{transform:none;filter:none}}
.card > *{position:relative}
.t-blank{background:repeating-linear-gradient(135deg,rgba(217,104,92,.18) 0 6px,transparent 6px 12px);border:1.5px solid rgba(217,104,92,.5);color:var(--miss);align-items:center;justify-content:center;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}

.strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.strip .card{width:100%;padding:4px;border-radius:6px}
.strip .card.empty{font-size:18px}
.strip .card.cur{border-color:var(--gold);color:var(--gold);border-style:solid}
.strip .card{container-type:inline-size}
.strip .card .pn{font-size:min(11px, calc(235cqw / var(--len, 6)));white-space:nowrap;word-break:keep-all}   /* long last names shrink to fit instead of breaking */
.strip .card .tier{font-size:7px}
.strip .card .pct{font-size:8px}
.strip .t-blank .pn{font-size:18px}
.panel{border:1px solid var(--gold);border-radius:14px;padding:16px;background:var(--page);display:flex;flex-direction:column;gap:10px}
.prompt.big{font-size:clamp(26px,7.5vw,34px)}
.ptop{display:flex;justify-content:space-between;align-items:center}
.clock{font:900 36px/1 var(--display);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:transform .1s linear}
.panel.low .clock{color:var(--miss);animation:pulse .5s ease-in-out infinite alternate}
.panel.low .bar i{background:var(--miss)}
@keyframes pulse{to{transform:scale(1.12)}}
.lastpull{font-size:15px;color:var(--muted);border-left:3px solid var(--gold);padding:4px 10px}
.lastpull strong{color:var(--text)}
.lastpull.bad{border-color:var(--miss);color:var(--miss)}
.guess{display:flex;flex-direction:column;gap:8px}
.dym{font-size:16px;color:var(--muted)}
.dym button{font:600 16px var(--body);color:var(--gold);background:rgba(232,184,74,.12);border:1px solid rgba(232,184,74,.4);border-radius:8px;padding:4px 10px;cursor:pointer;margin:2px 0}
/* guess box */
.guess{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.row{display:flex;gap:8px}
.ac{position:relative;flex:1;min-width:0;display:flex}
.ac input{flex:1;min-width:0}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;list-style:none;margin:0;padding:4px;background:var(--sleeve);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.sugg li{padding:9px 10px;border-radius:7px;font:500 17px var(--body);cursor:pointer}
.sugg li:hover,.sugg li[aria-selected="true"]{background:rgba(232,184,74,.16);color:var(--gold)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.18);color:var(--text);cursor:pointer;font:inherit}
.modes button b{font:900 20px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.modes button small{font-size:13px;color:var(--muted)}
.modes button[aria-checked="true"]{border-color:var(--gold);background:rgba(232,184,74,.1)}
.modes button[aria-checked="true"] b{color:var(--gold)}
.hardtag{font:700 11px var(--mono);letter-spacing:.06em;color:#ff9a3c;white-space:nowrap}
.hardtag.big{font-size:14px;vertical-align:middle;border:1px solid rgba(255,154,60,.45);border-radius:6px;padding:2px 6px;margin-left:6px}
.panel .fine{font-size:13px;color:var(--muted)}
.row input{flex:1;min-width:0;font:500 18px var(--body);color:var(--text);background:var(--binder);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.row input::placeholder{color:var(--muted)}
.sugg{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--binder)}
.sugg:empty{display:none}
.sugg li button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);color:var(--text);font:500 17px var(--body);padding:10px 12px;cursor:pointer}
.sugg li:first-child button{border-top:0}
.sugg li button[aria-selected="true"],.sugg li button:hover{background:rgba(232,184,74,.12)}
.sugg small{color:var(--muted);font:500 12px var(--mono)}
.status{font-size:15px;min-height:1.4em;color:var(--muted)}
.status.bad{color:var(--miss)}
.strikes{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.strikes i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.strikes i.x{background:var(--miss);border-color:var(--miss)}
.skip{background:none;border:0;color:var(--muted);font:500 14px var(--body);text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* results */
.results{border:1px solid var(--gold);border-radius:14px;padding:18px;background:var(--page);display:flex;flex-direction:column;gap:14px}
.results h2{font:900 34px/1 var(--display);text-transform:uppercase;margin:0}
.results .big{font:900 64px/0.9 var(--display);font-variant-numeric:tabular-nums;color:var(--gold)}
.results .big small{font:600 14px var(--mono);color:var(--muted);margin-left:6px}
.share{font:500 15px/1.5 var(--mono);white-space:pre-wrap;background:var(--binder);border-radius:10px;padding:12px;border:1px solid var(--line);margin:0;user-select:all}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.recap li{border-top:1px solid var(--line);padding-top:10px;font-size:15px;color:var(--muted)}
.recap li b{color:var(--text);display:block;font-weight:600}
.recap li strong{color:var(--text);font-weight:600}
.rh{font:900 22px var(--display);text-transform:uppercase;letter-spacing:.02em;margin:14px 0 0}
.recap .mine{color:var(--text);margin:4px 0 6px}
.recap dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:14px}
.recap dt{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.recap dd{margin:0;color:var(--text)}
.recap dd i{font-style:normal;font:500 12px var(--mono);color:var(--muted)}
.swatch.brick{background:repeating-linear-gradient(45deg,#3a2f42 0 3px,#2a2232 3px 6px);border:1px solid var(--line)}
.standing{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.standing div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sleeve)}
.standing b{font:900 34px/1 var(--display);color:var(--gold);display:block;font-variant-numeric:tabular-nums}
.standing small{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.curve{margin:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;background:var(--sleeve)}
.curve figcaption{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.curve svg{width:100%;height:auto;display:block;overflow:visible}
.curve .bars rect{fill:rgba(239,232,220,.12)}
.curve .line{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round}
.curve .axis{stroke:var(--line)}
.curve .tick{font:500 9px var(--mono);fill:var(--muted)}
.curve .cut{stroke:rgba(239,232,220,.35);stroke-dasharray:2 3}
.curve .cutl{font:600 9px var(--mono);fill:var(--muted)}
.curve line.me{stroke:var(--gold);stroke-width:2}
.curve circle.me{fill:var(--gold)}
.curve .mel{font:700 11px var(--mono);fill:var(--gold)}
.results .fine{font-size:13px;color:var(--muted);margin:0}
.curve .fine{margin:6px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.captcha:empty{display:none}
.captcha{margin-top:12px;display:flex;justify-content:center}
.rep{font-size:13px;margin-top:4px;padding:0}
.radios{display:flex;flex-direction:column;gap:6px;margin:4px 0}
.form .radios label{flex-direction:row;gap:8px;align-items:center;font:500 15px var(--body);text-transform:none;letter-spacing:0;color:var(--text)}
.form .radios input{accent-color:var(--gold);width:16px;height:16px}
.form textarea{resize:vertical}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.help{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font:700 18px var(--body);cursor:pointer;line-height:1}
.help:hover{border-color:var(--gold);color:var(--gold)}
.howto ul{margin:0 0 14px;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.howto li strong{color:var(--text);font-weight:600}
.tiers{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:12px}
.tiers th{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 0 6px}
.tiers td{padding:6px 0;border-top:1px solid var(--line)}
.tiers td:nth-child(2),.tiers td:nth-child(3),.tiers th:nth-child(2),.tiers th:nth-child(3){text-align:right}
.swatch{display:inline-block;width:14px;height:19px;border-radius:3px;vertical-align:middle;margin-right:8px;position:relative;overflow:hidden}
.tag{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;color:var(--muted)}
.tag.live{color:var(--gold);border-color:rgba(232,184,74,.45)}
.next{font:600 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.foot{font:500 12px var(--mono);color:var(--muted);letter-spacing:.04em;text-align:center}
/* accounts */
.chip{display:inline-block;margin-top:8px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(232,184,74,.1);border:1px solid rgba(232,184,74,.35);border-radius:999px;padding:4px 10px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog.sheet{width:min(440px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:20px;border-radius:14px;border:1px solid var(--gold);background:var(--page);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog.sheet::backdrop{background:rgba(10,7,14,.75);backdrop-filter:blur(3px)}
.sheet h2{font:900 34px/1 var(--display);text-transform:uppercase;margin:0 0 8px}
.sheet .mark{font-size:52px;margin-bottom:10px}
.sheet p{color:var(--muted);margin:0 0 14px}
.sheet .fine{font-size:14px;margin:12px 0 0}
.form{display:flex;flex-direction:column;gap:10px}

<body>

<div class="wrap">

<dialog class="sheet" id="sheet"><div id="sheetBody"></div><div id="captcha" class="captcha"></div></dialog>

<script src="rarity.js"></script>
<script src="prompts.js"></script>
<script>
/* Player database. players.json is built by build_players.py; until it exists the
   game falls back to players.sample.json (the original hand-typed starter list). */
let PLAYERS = [], BY_NAME = new Map(), BY_ID = new Map(), DB_NOTE = '';
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,'');
async function loadPlayers(){
  for (const [file, note] of [['players.json', n => `${n.toLocaleString()} players since 1970-71`],
                              ['players.sample.json', n => `Sample database of ${n} players (full database not built yet)`]]) {
    try {
      const res = await fetch(file, { cache:'no-cache' });
      if (!res.ok) continue;
      PLAYERS = await res.json();
      DB_NOTE = note(PLAYERS.length);
      break;
    } catch (e) {}
  }
  if (!PLAYERS.length) throw new Error('no player data');
  RM = FTLRarity.create(PLAYERS);
  GEN = FTLPrompts.create(PLAYERS, { rarity: RM });
  for (const p of PLAYERS) {
    p.g = p.g || ''; p.k = norm(p.n); BY_ID.set(p.id, p);
    // same name, different players (two Larry Johnsons, etc.) share one entry
    if (!BY_NAME.has(p.k)) BY_NAME.set(p.k, []);
    BY_NAME.get(p.k).push(p);
  }
}

/* Prompts come from prompts.js, built from players.json once it loads. A prompt's id
   describes it ("pair:LAL:MIA"), so PROMPTS[id] works for any id, including ones in
   packs stored before players.json changed. Unknown ids give undefined. */
let GEN = null, RM = null;
/* One pack a day. ?test=1 turns on a hidden test mode (for Lanky): unlimited practice packs that
   never save picks, so prompts and scoring can be tried without using up the daily pack. */
const TEST_MODE = new URLSearchParams(location.search).get('test') === '1';
/* traffic stats (GoatCounter: no cookies, no banner). Site code from goatcounter.com, e.g.
   'fromthelogo' for fromthelogo.goatcounter.com. Empty = off. Test mode and local copies don't count. */
const GOATCOUNTER = '';
if (GOATCOUNTER && !TEST_MODE && !/^(localhost|127\.|\[?::1)/.test(location.hostname)) {
  const gc = document.createElement('script');
  gc.async = true; gc.src = 'https://gc.zgo.at/count.js'; gc.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  document.head.appendChild(gc);
}
const PACK_SIZE = FTLPrompts.PACK_SIZE;   // prompts per pack (8)
const MAX_PTS = PACK_SIZE * 100;          // a perfect pack: all 1 of 1s
const PROMPTS = new Proxy({}, { get: (_, id) => (GEN && typeof id === 'string' && GEN.get(id)) || undefined });

/* seeded randomness */
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0}}
function rng(seed){let a=hash(seed)();return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* simulated pick rates: stars get picked a lot, deep cuts rarely */
/* simulated pick rates (rarity.js): thousands of simulated fans per prompt, recalling and picking
   players by recognition. Recomputed when the shared fame model changes. */
let oddsCache = {};
function odds(pid){
  if (oddsCache[pid]) return oddsCache[pid];
  const valid = PLAYERS.filter(PROMPTS[pid].test);
  const share = RM.sim(valid, pid, undefined, undefined, PROMPTS[pid].teams);   // team prompts weigh how tied each player is to the team
  const list = valid.map(p => ({ id:p.id, n:p.n, pct: 100 * share.get(p.id) })).sort((a,b)=>b.pct-a.pct);
  return oddsCache[pid] = { list, map: new Map(list.map(x=>[x.id,x.pct])) };
}
/* Six tiers by pick rate. Each tier pays a flat value, and every point is a foot back. */
const TIERS = [
  { min:25,  id:'copper',  cls:'t-copper',  name:'Copper',    short:'Copper',  pts:10,  emoji:'🟫', range:'25%+' },
  { min:10,  id:'silver',  cls:'t-silver',  name:'Silver',    short:'Silver',  pts:25,  emoji:'⬜', range:'10–25%' },
  { min:5,   id:'gold',    cls:'t-gold',    name:'Gold',      short:'Gold',    pts:40,  emoji:'🟨', range:'5–10%' },
  { min:2,   id:'emerald', cls:'t-emerald', name:'Emerald',   short:'Emerald', pts:60,  emoji:'🟩', range:'2–5%' },
  { min:0.5, id:'refr',    cls:'t-refr',    name:'Refractor', short:'Refr',    pts:80,  emoji:'🌈', range:'0.5–2%' },
  { min:0,   id:'one',     cls:'t-one',     name:'1 of 1',    short:'1/1',     pts:100, emoji:'💎', range:'under 0.5%' },
];
/* saved packs from before the rename used other tier ids (and "gold" meant the 80-point tier) */
const OLD_TIERS = { base:'copper', ins:'silver', refr:'gold', num:'emerald', gold:'refr', one:'one' };
const tierOf = pct => TIERS.find(t => pct >= t.min);
const pointsOf = pct => tierOf(pct).pts;
const fmtPct = p => p < 0.1 ? '<0.1%' : p < 10 ? p.toFixed(1) + '%' : Math.round(p) + '%';
/* how sure a pick % is: live (real picks so far), final (day settled), or estimated (no server data) */
const rateTag = st => st.mode !== 'daily' || !st.online ? 'est.' : st.settled ? 'final' : 'live';
function serial(){ return ''; }   // tier names say it all now ("1 of 1")

/* dates: one global day, Eastern time (America/New_York, daylight saving included). Everyone gets
   the new pack at midnight ET. The server's clock decides (get_today, synced at startup); the
   device clock is only the fallback when offline. */
const TZ = 'America/New_York';
const GRACE = 5 * 60000;   // a pack in progress at midnight can finish (pack_date_open in schema.sql)
let clockSkew = 0;          // server time minus device time
const nowMs = () => Date.now() + clockSkew;
const ET_FMT = new Intl.DateTimeFormat('en-US', { timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' });
const etParts = ms => Object.fromEntries(ET_FMT.formatToParts(ms).map(x => [x.type, x.value]));
function dayKey(ms = nowMs()){ const x = etParts(ms); return `${x.year}-${x.month}-${x.day}`; }
const addDays = (key, n) => { const [y,m,d] = key.split('-').map(Number); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0, 10); };
function etStart(key){   // the instant a date starts in Eastern time (midnight ET)
  const [y,m,d] = key.split('-').map(Number), want = Date.UTC(y, m-1, d);
  let t = want + 5 * 3600e3;   // EST guess, then correct for daylight saving
  for (let k = 0; k < 2; k++) { const x = etParts(t); t += want - Date.UTC(+x.year, +x.month-1, +x.day, +x.hour, +x.minute, +x.second); }
  return t;
}
const packNum = key => Math.round((Date.parse(key) - Date.parse('2026-10-21')) / 864e5);   // Oct 22 = pack #1
const fmtDate = (key, opts = { month:'short', day:'numeric' }) => new Date(key + 'T12:00:00Z').toLocaleDateString(undefined, { timeZone:'UTC', ...opts });
async function syncClock(){
  if (!sb) return;
  try {
    const t0 = Date.now(), r = await rpc('get_today', {}, 4000), t1 = Date.now();
    clockSkew = Date.parse(r.now) - (t0 + t1) / 2;
  } catch(e){ console.warn('get_today failed; using the device clock', e); }
}

function buildPack(seed){
  return seed.startsWith('daily-') ? GEN.daily(seed.slice(6)) : GEN.random(rng(seed));
}
/* easy = name suggestions while typing, hard = type the full name. Picked before the pack starts,
   locked for that pack; the last choice is the default next time (new players start on easy). */
const LEVEL_KEY = 'fromthelogo:level';
const prefLevel = () => { try { return localStorage.getItem(LEVEL_KEY) === 'hard' ? 'hard' : 'easy'; } catch(e){ return 'easy'; } };
const isHard = (st = state) => st.level === 'hard';
const HARD_BADGE = '🔥 HARD';
function freshState(mode, seed){
  return { mode, seed, tv:2, level: prefLevel(), date: dayKey(), started:false, prompts: buildPack(seed), slots: Array.from({length:PACK_SIZE}, () => ({ status:'open', strikes:0 })), active:0 };
}
/* saved packs are per user: fromthelogo:<user id>:<date> ("local" when offline with no user) */
const storeKey = (date, uid = user?.id || 'local') => `fromthelogo:${uid}:${date}`;
function load(date = dayKey()){
  try {
    const s = JSON.parse(localStorage.getItem(storeKey(date)));
    if (s && s.prompts && s.prompts.length === PACK_SIZE && s.prompts.every(id => PROMPTS[id])) {
      s.date ||= date;
      if (!s.tv) { s.slots.forEach(x => { if (x.tier) x.tier = OLD_TIERS[x.tier] || x.tier; }); s.tv = 2; }
      s.level ||= s.started ? 'hard' : prefLevel();   // packs from before modes were typed in full
      return s;
    }
  } catch(e){}
  return null;
}
function save(st = state){ if (st.mode !== 'daily') return; try { localStorage.setItem(storeKey(st.date), JSON.stringify(st)); } catch(e){} }

/* ---------- backend (Supabase). All optional: if it can't be reached, the game runs on simulated rates. ---------- */
const SB_URL = 'https://irtsjiluvpbxgxvteots.supabase.co';
const SB_KEY = 'sb_publishable_fpOzn7FpnH4-OnC1PN5jVQ_6n75KR6K';   // publishable key: meant to be public
const SB_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js';
const K_PRIOR = FTLRarity.K;   // real picks take over from the simulation: (picks + K * sim) / (total + K), same as schema.sql
async function rpc(fn, args = {}, ms = 4000){
  if (!sb) throw new Error('offline');
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try {
    const { data, error } = await sb.rpc(fn, args).abortSignal(ctl.signal);
    if (error) throw error;
    return data;
  } finally { clearTimeout(t); }
}
const withTimeout = (promise, ms) => Promise.race([promise, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);
/* a date's picks are open while it's that date somewhere on Earth: until 00:00 UTC two days later */
const closesAt = date => etStart(addDays(date, 1)) + GRACE;   // end of that Eastern day (+ grace)

/* everyone gets the pack stored in Supabase; the first player of the day stores the one their browser built */
/* why the game is offline, shown in the footer and the Offline panel */
let offlineWhy = '';
const errText = e => [e?.message || e?.error_description || (typeof e === 'string' ? e : ''), e?.code, e?.status].filter(Boolean).join(' / ') || JSON.stringify(e);
const why = msg => { offlineWhy = offlineWhy || msg; console.warn('FromTheLogo offline:', msg); };
/* everyone gets the pack stored in Supabase. A pack already started offline can still go online
   if the stored pack is the same one (it normally is: every browser builds the same pack); its
   picks so far are queued and sent. */
async function syncPack(st){
  if (!user) { st.online = false; why(offlineWhy || 'not signed in'); return; }
  try {
    const stored = await rpc('get_or_create_pack', { p_date: st.date, p_prompts: st.prompts.map(id => ({ id, text: PROMPTS[id].text })) });
    const ids = (stored || []).map(x => x.id);
    const usable = ids.length === PACK_SIZE && ids.every(id => PROMPTS[id] && odds(id).list.length);
    if (!usable) { st.online = false; why(`today's stored pack doesn't fit this version of the game (${ids.length} prompts: ${ids.slice(0, 3).join(', ')}…)`); return; }
    if (st.started && ids.join() !== st.prompts.join()) {
      st.online = false; why("you started a different pack than today's stored one; tomorrow's will be online"); return;
    }
    st.prompts = ids;
    if (!st.online && st.started) {   // catch up picks made while offline
      st.unsent ||= [];
      st.slots.forEach((s, i) => { if (s.status === 'pulled' && !s.sent && !st.unsent.some(u => u[0] === i)) st.unsent.push([i, s.id]); });
    }
    st.online = true; offlineWhy = '';
  } catch(e){
    st.online = false;
    why(`couldn't get today's pack: ${errText(e)}`);
  }
}

/* real picks per prompt: 'date|idx' -> { total, counts: Map(player id -> picks) } */
const REAL = {};
function loadRates(date, rows){
  for (let i = 0; i < PACK_SIZE; i++) REAL[date + '|' + i] = { total:0, counts:new Map() };
  for (const r of rows || []) { const e = REAL[date + '|' + r.prompt_idx]; e.total += r.picks; e.counts.set(r.player_id, r.picks); }
}
/* a player's pick rate: Bayesian blend of real picks and the simulated estimate (worth K_PRIOR picks) */
function rateOf(st, idx, playerId){
  const sim = odds(st.prompts[idx]).map.get(playerId) ?? 0;
  const r = st.mode === 'daily' && st.online && REAL[st.date + '|' + idx];
  if (!r || !r.total) return sim;
  return FTLRarity.blend(r.counts.get(playerId) || 0, r.total, sim / 100);
}
function rateList(st, idx){
  return odds(st.prompts[idx]).list.map(x => ({ n:x.n, pct:rateOf(st, idx, x.id) })).sort((a,b) => b.pct - a.pct);
}

const pickArgs = (st, idx, playerId) =>
  ({ p_date:st.date, p_prompt_idx:idx, p_player_id:playerId, p_sim_pct:odds(st.prompts[idx]).map.get(playerId) ?? 0 });
async function sendPick(st, idx, playerId){
  try {
    const [r] = await rpc('submit_pick', pickArgs(st, idx, playerId), 3500);
    st.slots[idx].sent = true;
    const e = REAL[st.date + '|' + idx] ||= { total:0, counts:new Map() };
    e.total = r.prompt_picks; e.counts.set(playerId, r.player_picks);
    return true;
  } catch(e){ (st.unsent ||= []).push([idx, playerId]); return false; }
}
/* picks that didn't make it (offline, timeout) go up on the next visit, while the date is still open */
async function flushUnsent(st){
  if (!st.unsent?.length) return;
  if (nowMs() >= closesAt(st.date)) { st.unsent = []; save(st); return; }
  for (const [idx, id] of [...st.unsent]) {
    try { await rpc('submit_pick', pickArgs(st, idx, id)); if (st.slots[idx]) st.slots[idx].sent = true; }
    catch(e){ break; }
    st.unsent = st.unsent.filter(u => u[0] !== idx); save(st);
  }
}
async function sendScore(st){
  if (st.mode !== 'daily' || !st.online || st.scoreSent || st.slots.some(s => s.status === 'open')) return st.scoreSent;
  if (nowMs() >= closesAt(st.date)) return;
  try {
    await rpc('submit_score', { p_date:st.date, p_total:st.slots.reduce((a,s) => a + (s.pts||0), 0), p_mode:st.level || 'hard' });
    st.scoreSent = true; save(st);
  } catch(e){}
  return st.scoreSent;
}
/* once a date closes, re-score its pack with the final pick rates */
async function settle(st){
  if (st.settled || !st.online || nowMs() < closesAt(st.date)) return false;
  loadRates(st.date, await rpc('get_pick_rates', { p_date:st.date }));
  const live = st.slots.reduce((a,s) => a + (s.pts||0), 0);
  st.slots.forEach((s, i) => {
    if (s.status !== 'pulled' || s.id == null) return;
    s.pct = rateOf(st, i, s.id); const t = tierOf(s.pct); s.tier = t.id; s.pts = t.pts;
  });
  st.settled = { live, total: st.slots.reduce((a,s) => a + (s.pts||0), 0) };
  save(st); return true;
}
async function settlePast(){
  let latest = null;
  for (let k = 7; k >= 1; k--) {
    const st = load(addDays(dayKey(), -k)); if (!st) continue;
    try { await flushUnsent(st); if (await settle(st)) latest = st; } catch(e){}
  }
  if (!latest) return;
  const day = fmtDate(latest.date);
  const { live, total } = latest.settled;
  note(`Your ${day} pack settled: <strong>${total}</strong> final` + (total !== live ? ` (live score was ${live})` : ' (same as live)'));
}
/* ---------- shared fame model: the rarity weights correct themselves from real picks ----------
   Supabase keeps one model per settled day. The first player after a day settles computes the
   next model from that day's picks (RM.update) and proposes it; the server keeps the first valid
   one, so everyone scores with the same weights. */
function useModel(m){ RM.setModel(m); oddsCache = {}; }
async function loadModel(){
  if (!sb) return null;
  try {
    const row = await rpc('get_fame_model', {}, 3000);
    if (row && FTLRarity.valid(row.model)) useModel(row.model);
    return row;
  } catch(e){ return null; }
}
function trainingDay(day){
  return (day.prompts || []).map((pr, i) => {
    const def = PROMPTS[pr.id];
    if (!def) return null;
    return { seed: pr.id, teams: def.teams, answers: PLAYERS.filter(def.test),
             counts: new Map((day.picks || []).filter(x => x.prompt_idx === i).map(x => [x.player_id, x.picks])) };
  }).filter(Boolean);
}
async function catchUpModel(row){
  if (!sb || !user || !row) return;
  let m = FTLRarity.valid(row.model) ? row.model : FTLRarity.DEFAULT_MODEL;
  let d = row.model_date || (row.first_pack && addDays(row.first_pack, -1));
  if (!d) return;
  try {
    for (let i = 0; i < 7; i++) {                       // at most a week per visit
      const next = addDays(d, 1);
      if (nowMs() < closesAt(next)) break;           // not settled yet
      const day = await rpc('get_closed_day', { p_date:next }, 8000);
      RM.setModel(m);
      const proposed = day ? RM.update(trainingDay(day)) : m;
      const stored = await rpc('propose_fame_model', { p_date:next, p_model:proposed }, 8000);
      m = FTLRarity.valid(stored) ? stored : proposed;
      d = next;
    }
  } catch(e){ console.warn('fame model update skipped', e); }

}

/* one daily pack per user: if this account already played today on another device, show that */
async function reconcileDay(st){
  if (!st.online) return;
  let day; try { day = await rpc('get_my_day', { p_date:st.date }); } catch(e){ return; }
  if (!day || (!day.picks.length && !day.submitted)) return;
  for (const p of day.picks) {
    const cur = st.slots[p.prompt_idx];
    if (cur.status === 'pulled' && cur.id === p.player_id) continue;
    st.slots[p.prompt_idx] = { status:'pulled', pick:BY_ID.get(p.player_id)?.n || `Player #${p.player_id}`, id:p.player_id,
                               pct:p.pct, tier:p.tier, pts:p.pts, strikes:0 };
  }
  if (day.mode) st.level = day.mode;   // finished on another device: that device's mode
  if (day.submitted) {
    st.slots = st.slots.map((s, i) => day.picks.some(p => p.prompt_idx === i) ? s : { status:'blank', strikes:3, pts:0 });
    st.scoreSent = true;
  }
  st.started = true;
  st.active = st.slots.findIndex(s => s.status === 'open');
  save(st);
}

/* ---------- accounts (Supabase Auth). Guests are anonymous users; signing up upgrades that same user. ---------- */
let sb = null, user = null, profile = null;
const isGuest = () => !!user?.is_anonymous;
const here = () => location.origin + location.pathname;
const TRANSFER = 'fromthelogo:transfer';   // { token, from }: a guest's history waiting to be claimed by an account
/* errors Supabase sends back in the URL after Google (e.g. that Google account already has its own account) */
const urlErr = (() => {
  const q = new URLSearchParams(location.hash.slice(1) + '&' + location.search.slice(1));
  return q.get('error') ? { code:q.get('error_code') || q.get('error'), msg:q.get('error_description') || '' } : null;
})();

function loadSupabase(){
  return new Promise(done => {
    if (window.supabase) return done();
    const el = document.createElement('script'); el.src = SB_JS; el.onload = el.onerror = () => done();
    document.head.appendChild(el); setTimeout(done, 6000);
  });
}
async function initAuth(){
  await loadSupabase();
  if (!window.supabase?.createClient) { why("couldn't load the Supabase library from cdn.jsdelivr.net (blocked or slow network)"); return; }
  try {
    sb = supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
    const { data } = await withTimeout(sb.auth.getSession(), 6000);
    user = data.session?.user || null;
    sb.auth.onAuthStateChange((ev, session) => { user = session?.user || null; });
  } catch(e){ why(`Supabase Auth unreachable: ${errText(e)}`); user = null; }
  if (urlErr || /access_token|error=/.test(location.hash + location.search)) history.replaceState(null, '', here());
}

/* the first time a user is known on this browser: claim guest history, adopt older saved packs, username, password */
async function afterLogin(){
  if (!user) return;
  adoptLocalPacks('local'); adoptLegacyPacks();
  let t = null; try { t = JSON.parse(localStorage.getItem(TRANSFER)); } catch(e){}
  if (t && !isGuest()) {
    try {
      const moved = await rpc('claim_transfer', { p_token:t.token }, 8000);
      localStorage.removeItem(TRANSFER);
      if (t.from !== user.id) { adoptLocalPacks(t.from); if (moved) note(`Moved ${moved} guest pack${moved > 1 ? 's' : ''} into your account.`); }
    } catch(e){ console.warn('claim_transfer failed', e); }
  }
  if (isGuest()) return;
  try { profile = await rpc('get_profile'); } catch(e){ profile = null; }
  if (user.user_metadata?.needs_password) await sheetSetPassword();
  if (profile && !profile.username) {
    const wanted = user.user_metadata?.username;
    try { if (wanted) { await rpc('set_username', { p_name:wanted }); profile.username = wanted; } } catch(e){}
    if (!profile.username) await sheetUsername();
  }
}
function adoptLocalPacks(fromUid){   // copy another id's saved packs to this user (keeps this user's own on clashes)
  try {
    for (const k of Object.keys(localStorage)) {
      const m = k.match(/^fromthelogo:([^:]+):(\d{4}-\d\d-\d\d)$/);
      if (!m || m[1] !== fromUid || fromUid === user.id) continue;
      if (!localStorage.getItem(storeKey(m[2]))) localStorage.setItem(storeKey(m[2]), localStorage.getItem(k));
      localStorage.removeItem(k);
    }
  } catch(e){}
}
function adoptLegacyPacks(){   // packs saved before accounts existed (fromthelogo:<date>)
  try {
    for (const k of Object.keys(localStorage)) {
      const m = k.match(/^fromthelogo:(\d{4}-\d\d-\d\d)$/);
      if (!m) continue;
      if (!localStorage.getItem(storeKey(m[1]))) localStorage.setItem(storeKey(m[1]), localStorage.getItem(k));
      localStorage.removeItem(k);
    }
  } catch(e){}
}
async function prepTransfer(){   // before a guest logs in to an existing account
  if (!isGuest()) return;
  const token = await rpc('start_transfer');
  localStorage.setItem(TRANSFER, JSON.stringify({ token, from:user.id }));
}

/* Cloudflare Turnstile CAPTCHA on guest and email sign-ins (Supabase Auth checks the token when
   Attack Protection > CAPTCHA is on). The site key is public. Empty = no CAPTCHA. Usually invisible;
   it only shows a checkbox (inside the open sheet) when Cloudflare isn't sure. */
const TURNSTILE_KEY = '';
let turnstileJs = null;
async function captchaToken(){
  if (!TURNSTILE_KEY) return undefined;
  turnstileJs ||= new Promise((ok, no) => {
    const el = document.createElement('script');
    el.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    el.onload = ok; el.onerror = () => { turnstileJs = null; no(new Error("Couldn't load the CAPTCHA (challenges.cloudflare.com). Check your connection.")); };
    document.head.appendChild(el);
  });
  await turnstileJs;
  return new Promise((ok, no) => {
    const box = $('captcha'); box.innerHTML = '';
    const done = (fn, v) => { try { turnstile.remove(id); } catch(e){} fn(v); };
    const id = turnstile.render(box, { sitekey:TURNSTILE_KEY, appearance:'interaction-only', theme:'dark',
      callback: t => done(ok, t),
      'error-callback': () => done(no, new Error('The CAPTCHA check failed. Try again.')),
      'timeout-callback': () => done(no, new Error('The CAPTCHA timed out. Try again.')) });
  });
}

  const signup = mode === 'signup';
  openSheet(`<h2>${signup ? 'Sign up' : 'Log in'}</h2>

      <label>Email<input name="email" type="email" autocomplete="email" required></label>

    </form>`, { locked:!!back });
  $('aUp').onclick = () => sheetAuth('signup', { back });

  const form = $('aForm'), err = m => { $('aErr').textContent = m; busy(form, false); };
  $('aGoogle').onclick = async () => {
    busy(form, true);
    try { await doGoogle(); } catch(e){ err(e.message || String(e)); }
  };
  form.onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));   // read before disabling: disabled inputs aren't in FormData
    busy(form, true); $('aErr').textContent = '';
    try { signup ? await doSignup(f.username.trim(), f.email.trim(), f.password) : await doLogin(f.email.trim(), f.password); }
    catch(e){ err(e.message || String(e)); }
  };
}
async function doSignup(name, email, password){
  if (!/^[A-Za-z0-9_]{3,20}$/.test(name)) throw new Error('Usernames are 3–20 letters, numbers or _.');
  if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('That email doesn\'t look right.');
  if (password.length < 6) throw new Error('Passwords need at least 6 characters.');
  if (!(await rpc('username_available', { p_name:name }))) throw new Error('That username is taken.');
  if (!user) {   // brand-new player: start as a guest so the account is the same user from the first pick
    const { data, error } = await guestSignIn();
    if (error) throw error;
    user = data.user;
  }
  if (!isGuest()) throw new Error("You're already logged in.");
  const { data, error } = await sb.auth.updateUser({ email, data:{ username:name, needs_password:true } }, { emailRedirectTo:here() });
  if (error) throw new Error(error.code === 'email_exists' || /already/i.test(error.message)
    ? 'That email already has an account. Log in instead.' : error.message);
  if (data.user.is_anonymous) {   // "Confirm email" is on: finish after the link
    openSheet(`<h2>Check your email</h2>
      <p>We sent a link to <strong>${esc(email)}</strong>. Open it on this device to finish: you'll set your password there. Until then you're still a guest, and nothing you play is lost.</p>
      <button class="btn primary wide" id="okBtn">Keep playing</button>`);
    $('okBtn').onclick = () => location.reload();   // now a guest: reload so the game starts as that user
    return;
  }
  await sb.auth.updateUser({ password, data:{ needs_password:false } }).then(r => { if (r.error) throw r.error; });
  await rpc('set_username', { p_name:name });
  location.reload();
}
async function doLogin(email, password){
  await prepTransfer();
  const { error } = await sb.auth.signInWithPassword({ email, password, options:{ captchaToken: await captchaToken() } });
  if (error) throw new Error(/confirm/i.test(error.message) ? 'Confirm your email first (check your inbox).'
    : /invalid/i.test(error.message) ? 'Wrong email or password.' : error.message);
  location.reload();
}
async function doGoogle(){
  if (isGuest()) {   // link Google to this guest; if that Google account already exists we log into it on return
    await prepTransfer();
    const { error } = await sb.auth.linkIdentity({ provider:'google', options:{ redirectTo:here() } });
    if (error) throw error;
  } else {
    const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:here() } });
    if (error) throw error;
  }
}

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function cardHTML(slot, i, flip){
  if (slot.status === 'open') return `<div class="card empty">${i+1}</div>`;
  if (slot.status === 'blank') return `<div class="card t-blank${flip?' flip':''}"><span class="tier">No pull</span><span class="pn" style="font-size:22px">✕</span><span class="pct">0 pts</span></div>`;
  const t = TIERS.find(x => x.id === slot.tier);
  return `<div class="card ${t.cls}${flip?' flip':''}"><span class="tier">${t.name}${serial(t,slot.pick)?' · '+serial(t,slot.pick):''}</span><span class="pn">${esc(slot.pick)}</span><span class="pct">${fmtPct(slot.pct)} · +${slot.pts}</span></div>`;
}

function miniCard(s, i, flip, cur){
  if (s.status === 'open') return `<div class="card empty${cur ? ' cur' : ''}">${i+1}</div>`;
  if (s.status === 'blank') return `<div class="card t-blank${flip?' flip':''}"><span class="pn">✕</span></div>`;
  const t = TIERS.find(x => x.id === s.tier);
  const parts = s.pick.split(' '); let ln = parts.at(-1); if (/^(Jr\.|II|III)$/.test(ln)) ln = parts.at(-2);
  return `<div class="card ${t.cls}${flip?' flip':''}" title="${esc(s.pick)} · ${t.name} · picked by ${fmtPct(s.pct)} · +${s.pts}"><span class="tier">${t.short}</span><span class="pn" style="--len:${Math.max(5, ln.length)}">${esc(ln)}</span><span class="pct">${fmtPct(s.pct)}</span></div>`;
}

let lastPull = null, tick = null;
const CLOCK = 20000;

function render(flipIdx = -1){
  const done = state.slots.every(s => s.status !== 'open');
  $('sub').textContent = state.mode === 'daily'
    ? `Pack #${packNum(state.date)} · ${fmtDate(state.date)}`
    : 'Unlimited pack';
  $('total').textContent = totalPts();
  $('foot').textContent = `${DB_NOTE} · ` + (state.mode !== 'daily' ? 'test pack: simulated pick rates, nothing saved'
    : state.online ? 'live pick rates' : `offline: simulated pick rates${offlineWhy ? ' (' + offlineWhy + ')' : ''}`);
  $('tabDaily').setAttribute('aria-pressed', view === 'game' && state.mode === 'daily');
  $('tabRip').setAttribute('aria-pressed', view === 'game' && state.mode !== 'daily');

  const strip = `<div class="strip">${state.slots.map((s,i) => miniCard(s, i, i === flipIdx, !done && state.started && i === state.active)).join('')}</div>`;
  const last = lastPull ? `<div class="lastpull ${lastPull.bad ? 'bad' : ''}">${lastPull.html}</div>` : '';
  let panel = '';
  if (!done && !state.started) {
    panel = `<div class="panel">
      <span class="num">${PACK_SIZE} prompts · 20 seconds each</span>
      <span class="prompt big">${state.mode === 'daily' ? "Ready to rip today's pack?" : 'Ready to rip a test pack?'}</span>
      <span class="meta">One prompt at a time. The clock starts as soon as each prompt shows up. Run out of time and it's a brick.</span>
      <div class="modes" role="radiogroup" aria-label="Mode">
        <button type="button" role="radio" data-level="easy" aria-checked="${!isHard()}"><b>Easy</b><small>Name suggestions as you type</small></button>
        <button type="button" role="radio" data-level="hard" aria-checked="${isHard()}"><b>${HARD_BADGE}</b><small>Type the full name</small></button>
      </div>
      <span class="fine">Locked once you start. Same scoring; you're ranked against players in your mode.</span>
      <button class="btn primary" id="startBtn">Start pack</button>
    </div>`;
  } else if (!done) {
    const i = state.active, s = state.slots[i], pid = state.prompts[i];
    panel = `${last}<div class="panel" id="panel">
      <div class="ptop"><span class="num">Prompt ${i+1} of ${PACK_SIZE}${isHard() ? ` · <span class="hardtag">${HARD_BADGE}</span>` : ''}</span><span class="clock" id="clock">20</span></div>
      <div class="bar"><i id="bar"></i></div>
      <span class="prompt big">${esc(PROMPTS[pid].text)}</span>
      <span class="meta">${odds(pid).list.length} players in the database fit</span>
      <div class="guess">
        <div class="row"><div class="ac"><input id="guess" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" placeholder="${isHard() ? 'Type the full name' : 'Start typing a name'}" aria-label="Player name"${isHard() ? '' : ' role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugg"'}><ul class="sugg" id="sugg" role="listbox" hidden></ul></div><button class="btn primary" id="shootBtn" type="button">Shoot</button></div>
        <div class="dym" id="dym" hidden></div>
        <div class="status ${msg.bad?'bad':''}" id="status">${esc(msg.text) || 'Tries left'}<span class="strikes">${[0,1,2].map(k=>`<i class="${k < s.strikes ? 'x' : ''}"></i>`).join('')}</span></div>
        <button class="skip" id="skipBtn">Skip this one (0 pts)</button>
      </div>
    </div>`;
  } else panel = last;
  $('page').innerHTML = strip + panel;

  $('startBtn')?.addEventListener('click', () => { state.started = true; save(); render(); focusInput(); });
  document.querySelectorAll('.modes [data-level]').forEach(b => b.addEventListener('click', () => {
    state.level = b.dataset.level; try { localStorage.setItem(LEVEL_KEY, state.level); } catch(e){}
    save(); render();
  }));
  const inp = $('guess');
  if (inp) {
    inp.addEventListener('input', () => { didYouMean([]); if (msg.bad) setStatus('', false); suggest(); });
    inp.addEventListener('blur', () => setTimeout(() => showSugg([]), 150));
    $('shootBtn').addEventListener('click', () => { tryGuess(); focusInput(); });
    inp.addEventListener('keydown', onKey);
    $('skipBtn').addEventListener('click', () => {
      const i = state.active; state.slots[i] = { status:'blank', strikes:3, pts:0 };
      lastPull = { html:'Skipped. Brick.', bad:true }; Stage.miss(); next(i);
    });
  }
  armTimer(done);
  renderResults(done);
}

function armTimer(done){
  clearInterval(tick);
  if (done || !state.started) return;
  const i = state.active, s = state.slots[i];
  if (!s || s.status !== 'open') return;
  if (!s.endsAt) { s.endsAt = Date.now() + CLOCK; save(); }
  const update = () => {
    const left = s.endsAt - Date.now();
    const c = $('clock'), b = $('bar'), pn = $('panel');
    if (c) c.textContent = Math.max(0, Math.ceil(left / 1000));
    if (b) b.style.transform = `scaleX(${Math.max(0, left / CLOCK)})`;
    if (pn) pn.classList.toggle('low', left < 6000);
    if (left <= 0) { clearInterval(tick); timeUp(i); }
  };
  update(); tick = setInterval(update, 100);
}
function timeUp(i){
  if (state.slots[i].status !== 'open') return;
  state.slots[i] = { status:'blank', strikes:3, pts:0, timeout:true };
  msg = { text:'', bad:false };
  lastPull = { html:"Time's up. Brick.", bad:true };
  Stage.miss(); next(i);
}

/* no dropdown: you type the full name, Enter shoots. Unknown names get a "did you mean". */
const isUsed = p => state.slots.some(s => s.status === 'pulled' && (s.id != null ? s.id === p.id : s.pick === p.n));
function exactMatch(raw){
  const q = norm(raw).trim().replace(/\s+/g,' ');
  return (q && BY_NAME.get(q)) || [];
}
function setStatus(text, bad){
  msg = { text, bad };
  const st = $('status'); if (!st) return;
  st.firstChild.nodeValue = text || 'Tries left';
  st.classList.toggle('bad', !!bad);
}
function tryGuess(){
  const inp = $('guess'); if (!inp || state.slots[state.active]?.status !== 'open') return;
  const raw = inp.value.trim(); if (!raw) return;
  const same = exactMatch(raw);
  if (same.length) {
    const open = same.filter(p => !isUsed(p));
    if (!open.length) { setStatus(`${same[0].n} is already in this pack. `, true); didYouMean([]); return; }
    return submit(open);
  }
  const close = fuzzy(raw);
  didYouMean(close);
  setStatus(close.length ? 'Not quite. ' : "Couldn't find that player. Check the spelling. ", true);
}
/* typo matching: Damerau-Levenshtein against full names and last names */
function editDist(a, b){
  const d = Array.from({length:a.length+1}, (_,i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    const c = a[i-1] === b[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + c);
    if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
  }
  return d[a.length][b.length];
}
function fuzzy(raw){
  const q = norm(raw).trim().replace(/\s+/g,' ');
  if (q.length < 3) return [];
  const out = [], seen = new Set();
  for (const p of PLAYERS) {
    if (seen.has(p.k) || isUsed(p)) continue;
    seen.add(p.k);
    const words = p.k.split(' ');
    const cands = [p.k, words.at(-1), words[0], words.slice(-2).join(' ')];
    let best = Infinity, len = q.length;
    for (const c of cands) { const d = editDist(q, c); if (d < best) { best = d; len = Math.max(q.length, c.length); } }
    const limit = Math.max(1, Math.min(3, Math.floor(len * 0.3)));
    if (best <= limit) out.push({ p, best, score: best / len - p.p * 0.002 });
  }
  if (!out.length) return [];
  const top = Math.min(...out.map(x => x.best));
  return out.filter(x => x.best === top).sort((a,b) => a.score - b.score).slice(0, 2).map(x => x.p);
}
function didYouMean(list){
  const box = $('dym'); if (!box) return;
  if (!list.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.innerHTML = 'Did you mean ' + list.map(p => `<button type="button" data-n="${esc(p.n)}">${esc(p.n)}</button>`).join(' or ') + '?';
  box.hidden = false;
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const inp = $('guess'); inp.value = b.dataset.n; sel = 0;
    didYouMean([]); setStatus('', false); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  }));
}
/* easy mode: up to 6 names from the WHOLE database that match what's typed. Matched by name only,
   never by who fits the prompt (that would give answers away). Every typed word has to start a
   word of the name (or sit inside it, from 3 letters); full-name starts first, then last-name
   starts, then the better-known player. Accents and punctuation ignored. */
let NAMES = null, sugg = [], suggAt = -1;
function nameIndex(){
  NAMES ||= [...BY_NAME.entries()].map(([k, ps]) => ({ k, n: ps[0].n, w: k.split(' '), fame: Math.max(...ps.map(p => (p.fame10 || 0) + (p.fame || 0) + (p.p || 0))) }));
  return NAMES;
}
function suggestions(raw){
  const q = norm(raw).trim().replace(/\s+/g, ' ');
  if (q.replace(/ /g, '').length < 2) return [];
  const qt = q.split(' '), out = [];
  for (const e of nameIndex()) {
    let rank;
    if (e.k.startsWith(q)) rank = 0;
    else {
      const used = new Set(); let inside = false, ok = true;
      for (const t of qt) {
        let j = e.w.findIndex((w, x) => !used.has(x) && w.startsWith(t));
        if (j < 0 && t.length >= 3) { j = e.w.findIndex((w, x) => !used.has(x) && w.includes(t)); inside = j >= 0 || inside; }
        if (j < 0) { ok = false; break; }
        used.add(j);
      }
      if (!ok) continue;
      rank = inside ? 3 : e.w.at(-1).startsWith(qt[0]) ? 1 : 2;
    }
    out.push({ e, rank });
  }
  return out.sort((a, b) => a.rank - b.rank || b.e.fame - a.e.fame || a.e.n.length - b.e.n.length).slice(0, 6).map(x => x.e.n);
}
function suggest(){
  const inp = $('guess');
  if (!inp || isHard()) return;
  showSugg(suggestions(inp.value));
}
function showSugg(list){
  const box = $('sugg'), inp = $('guess'); if (!box || !inp) return;
  sugg = list; suggAt = -1;
  // nothing to suggest once the box already holds exactly that name
  if (!list.length || (list.length === 1 && norm(list[0]) === norm(inp.value.trim()))) { box.hidden = true; box.innerHTML = ''; inp.setAttribute('aria-expanded', 'false'); return; }
  box.innerHTML = list.map((n, k) => `<li role="option" id="sg${k}" data-k="${k}">${esc(n)}</li>`).join('');
  box.hidden = false; inp.setAttribute('aria-expanded', 'true');
  box.querySelectorAll('li').forEach(li => li.addEventListener('pointerdown', e => { e.preventDefault(); pickSugg(+li.dataset.k); }));
}
function pickSugg(k){
  const inp = $('guess'); if (!inp || !sugg[k]) return;
  inp.value = sugg[k]; showSugg([]); didYouMean([]); if (msg.bad) setStatus('', false);
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
}
function moveSugg(d){
  if (!sugg.length || $('sugg').hidden) return false;
  suggAt += d;                                   // cycles through the list and back to the typed text (-1)
  if (suggAt < -1) suggAt = sugg.length - 1;
  if (suggAt >= sugg.length) suggAt = -1;
  $('sugg').querySelectorAll('li').forEach((li, k) => li.setAttribute('aria-selected', k === suggAt));
  $('guess').setAttribute('aria-activedescendant', suggAt >= 0 ? 'sg' + suggAt : '');
  return true;
}
function onKey(e){
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (moveSugg(e.key === 'ArrowDown' ? 1 : -1)) e.preventDefault(); return; }
  if (e.key === 'Escape' && sugg.length) { showSugg([]); return; }
  if (e.key === 'Enter'){
    e.preventDefault();
    if (suggAt >= 0) { pickSugg(suggAt); return; }   // a highlighted suggestion fills the box; Enter again shoots
    showSugg([]); tryGuess();
  }
}
function focusInput(){ const i = $('guess'); if (i) i.focus({preventScroll:true}); }

async function submit(cands){
  const i = state.active, pid = state.prompts[i], slot = state.slots[i];
  const p = cands.filter(PROMPTS[pid].test).sort((a,b) => b.p - a.p)[0], name = cands[0].n;
  if (!p) {
    slot.strikes++;
    if (slot.strikes >= 3) { state.slots[i] = { status:'blank', strikes:3, pts:0 }; msg = {text:'',bad:false}; lastPull = { html:`${esc(name)} doesn't fit either. Brick.`, bad:true }; Stage.miss(); return next(i); }
    msg = { text:`${name} doesn't fit. `, bad:true };
    save(); render();
    $('panel')?.classList.add('shake');
    focusInput(); return;
  }
  // stop the clock and lock the input while the pick goes up
  state.slots[i] = { status:'pending', strikes:slot.strikes };
  ['guess','shootBtn','skipBtn'].forEach(id => { const el = $(id); if (el) el.disabled = true; });
  if (state.mode === 'daily' && state.online) await sendPick(state, i, p.id);
  const pct = rateOf(state, i, p.id), t = tierOf(pct);
  state.slots[i] = { status:'pulled', pick:name, id:p.id, pct, tier:t.id, pts:pointsOf(pct), strikes:slot.strikes };
  msg = {text:'',bad:false};
  const tag = rateTag(state);
  lastPull = { html:`<strong>${esc(name)}</strong> · ${t.name} · picked by ${fmtPct(pct)}${tag === 'live' ? ' so far' : ''} · +${pointsOf(pct)}<span class="tag ${tag}">${tag}</span>`, bad:false };
  Stage.pull(distOf(totalPts()), state.slots[i].pts);
  next(i);
}
function next(i){
  state.active = state.slots.findIndex(s => s.status === 'open');
  save(); render(i);
  if (state.active < 0) sendScore(state);
  if (state.active >= 0) focusInput();
}

function shareText(){
  const total = state.slots.reduce((a,s)=>a+(s.pts||0),0);
  const row = state.slots.map(s => s.status === 'blank' ? '❌' : TIERS.find(t=>t.id===s.tier).emoji).join('');
  const head = (state.mode === 'daily' ? `FromTheLogo #${packNum(state.date)}` : 'FromTheLogo · test pack') + (isHard() ? ' ' + HARD_BADGE : '');
  const d = distOf(total);
  return `${head}\n${row}\n${total} / ${MAX_PTS} · 🏀 ${Math.round(d)} ft (${distLabel(d)})`;
}
let ratesFor = '';   // which daily pack's full pick rates have been fetched for the recap
/* today's board (get_day_board): everyone's current scores as a histogram, my rank, the deepest
   real pick per prompt. Refreshed every minute while the results are open, until the day settles. */
let board = null, boardTimer = 0;
async function refreshBoard(){
  clearTimeout(boardTimer);
  const date = state.date;
  if (state.mode !== 'daily' || !state.online || state.slots.some(s => s.status === 'open')) return;
  try {
    await sendScore(state);
    const [b, rows] = await Promise.all([rpc('get_day_board', { p_date:date, p_mode:state.level || 'hard' }, 6000), rpc('get_pick_rates', { p_date:date }, 6000)]);
    if (state.date !== date) return;
    loadRates(date, rows); board = { date, ...b };
    renderResults(true);
    if (!b.final) boardTimer = setTimeout(refreshBoard, 60000);
  } catch(e){ console.warn('board', e); boardTimer = setTimeout(refreshBoard, 60000); }
}
const nth = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th','st','nd','rd'][n % 10] || 'th');
/* "You beat 82% of players today" + rank */
function standingHTML(b){
  if (!b.me) return '';
  const others = b.players - 1, beat = others > 0 ? Math.round(100 * b.me.below / others) : 0;
  const ties = b.players - b.me.below - b.me.rank;
  return `<div class="standing">
    <div><b>${others > 0 ? beat + '%' : '1st'}</b><small>${others > 0 ? `of ${b.mode === 'hard' ? 'hard-mode' : 'easy-mode'} players beaten${b.final ? '' : ' so far'}` : 'to finish today'}</small></div>
    <div><b>#${b.me.rank}</b><small>of ${b.players.toLocaleString()}${ties > 0 ? ` · tied with ${ties}` : ''}</small></div>
  </div>`;
}
/* score curve: bars of 50 points, a smoothed curve over them, my marker, a few "top X%" labels */
function curveHTML(b){
  const n = b.players, hist = b.hist || [];
  if (!n) return '';
  const W = 340, H = 150, top = 26, base = H - 22, x = v => 8 + (W - 16) * v / MAX_PTS;
  const bins = Array.from({ length:MAX_PTS / 50 }, (_, k) => hist.slice(k * 5, k * 5 + 5).reduce((a, c) => a + c, 0));
  bins[bins.length - 1] += hist[MAX_PTS / 10] || 0;   // 800 goes in the last bar
  // smoothed: a gaussian over each 10-point bucket, scaled to bar units (players per 50 points)
  const bw = Math.max(25, 60 / Math.cbrt(n) * 4);
  const curve = [];
  for (let v = 0; v <= MAX_PTS; v += 10) {
    let d = 0; hist.forEach((c, k) => { if (c) { const z = (v - (k * 10 + 5)) / bw; d += c * Math.exp(-z * z / 2); } });
    curve.push([v, d * 50 / (bw * Math.sqrt(2 * Math.PI))]);
  }
  const peak = Math.max(1, ...bins, ...curve.map(c => c[1]));
  const y = c => base - (base - top) * c / peak;
  const bars = bins.map((c, k) => c ? `<rect x="${x(k * 50) + 1}" y="${y(c)}" width="${x(50) - x(0) - 2}" height="${base - y(c)}" rx="2"/>` : '').join('');
  const path = curve.map(([v, c], i) => (i ? 'L' : 'M') + x(v).toFixed(1) + ' ' + y(c).toFixed(1)).join(' ');
  // "top X%: S+" labels from the real scores (only once there are enough players to mean something)
  const cut = share => { let acc = 0; for (let k = hist.length - 1; k >= 0; k--) { acc += hist[k]; if (acc >= share * n) return k * 10; } return 0; };
  const marks = n >= 20 ? [[0.1, 'top 10%'], [0.5, 'top half']].map(([sh, label]) => [cut(sh), label]) : [];
  const me = b.me ? b.me.score : null;
  const pctile = b.me && n > 1 ? Math.round(100 * b.me.below / (n - 1)) : null;
  const lbl = (v, txt, cls) => {
    const anchor = x(v) < 60 ? 'start' : x(v) > W - 60 ? 'end' : 'middle';
    return `<text class="${cls}" x="${x(v)}" text-anchor="${anchor}"`;
  };
  return `<figure class="curve">
    <figcaption>Today's scores · ${b.mode === 'hard' ? 'hard' : 'easy'} mode <span class="tag ${b.final ? 'final' : 'live'}">${b.final ? 'final' : 'live'}</span></figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribution of today's scores from 0 to ${MAX_PTS}${me != null ? `; you scored ${me}` : ''}">
      <g class="bars">${bars}</g>
      <path class="line" d="${path}"/>
      <line class="axis" x1="${x(0)}" x2="${x(MAX_PTS)}" y1="${base}" y2="${base}"/>
      ${[0, 200, 400, 600, 800].map(v => `${lbl(v, '', 'tick')} y="${H - 6}">${v}</text>`).join('')}
      ${marks.map(([v, label], i) => {   // label on the side away from my marker
        const left = me != null ? v <= me : x(v) > W / 2;
        return `<line class="cut" x1="${x(v)}" x2="${x(v)}" y1="${top + 2 + i * 12}" y2="${base}"/><text class="cutl" x="${x(v) + (left ? -4 : 4)}" text-anchor="${left ? 'end' : 'start'}" y="${top + 9 + i * 12}">${label}: ${v}+</text>`;
      }).join('')}
      ${me != null ? `<line class="me" x1="${x(me)}" x2="${x(me)}" y1="10" y2="${base}"/><circle class="me" cx="${x(me)}" cy="${base}" r="4"/>${lbl(me, '', 'mel')} y="9">You ${me}${pctile != null ? ` · beat ${pctile}%` : ''}</text>` : ''}
    </svg>
    ${n < 20 ? `<p class="fine">Early: ${n} player${n > 1 ? 's' : ''} so far. The curve fills in as more people finish.</p>` : ''}
  </figure>`;
}
/* "Report a wrong answer": a listed player who doesn't fit, or a player who fits but wasn't
   accepted. Stored in Supabase (reports) for the admin page. */
const canReport = () => state.mode === 'daily' && state.online && !!user;
function sheetReport(i){
  const pid = state.prompts[i], l = rateList(state, i), s = state.slots[i];
  const names = [...new Set([s.status === 'pulled' ? s.pick : null, l[0]?.n, ...l.slice(-3).map(x => x.n)].filter(Boolean))];
  openSheet(`<h2>Report a wrong answer</h2><p><strong>${esc(PROMPTS[pid].text)}</strong></p>
    <form class="form" id="rForm" novalidate>
      <div class="radios">
        <label><input type="radio" name="kind" value="wrong" checked> A player counted here doesn't fit</label>
        <label><input type="radio" name="kind" value="missing"> A player who fits wasn't accepted</label>
      </div>
      <label>Player<input name="player" list="rNames" maxlength="80" autocomplete="off" required></label>
      <datalist id="rNames">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <label>Note (optional)<textarea name="note" rows="3" maxlength="500" placeholder="e.g. he was traded before playing a game"></textarea></label>
      <p class="err" id="rErr"></p>
      <button class="btn primary wide" type="submit">Send report</button>
      <button class="link" type="button" id="rCancel">Cancel</button>
    </form>`);
  $('rCancel').onclick = closeSheet;
  $('rForm').onsubmit = async e => {
    e.preventDefault();
    const form = e.target, f = Object.fromEntries(new FormData(form)), name = f.player.trim();
    if (!name) { $('rErr').textContent = 'Which player?'; return; }
    busy(form, true);
    const match = exactMatch(name)[0];
    try {
      await rpc('submit_report', { p_date:state.date, p_prompt_idx:i, p_kind:f.kind, p_player_id:match ? match.id : null,
                                   p_player_name:match ? match.n : name, p_note:f.note || null });
      openSheet(`<h2>Thanks</h2><p>Got it. We'll check <strong>${esc(match ? match.n : name)}</strong> on “${esc(PROMPTS[pid].text)}”.</p>
        <button class="btn primary wide" id="rOk">Close</button>`);
      $('rOk').onclick = closeSheet;
    } catch(err){ $('rErr').textContent = /too many/i.test(err.message) ? "That's a lot of reports for one day. Thanks, we'll get to them." : "Couldn't send it. Try again."; busy(form, false); }
  };
}

/* per-prompt reveal: my pick, the most picked, the 3 deepest valid answers, the deepest real pull */
function revealHTML(i){
  const pid = state.prompts[i], l = rateList(state, i), s = state.slots[i], tag = rateTag(state);
  const live = tag === 'live', top = l[0], deep3 = l.slice(-3).reverse();
  const t = s.status === 'pulled' ? TIERS.find(t => t.id === s.tier) : null;
  const real = board?.date === state.date && board.deepest?.find(d => d.prompt_idx === i);
  const realName = real && (BY_ID.get(real.player_id)?.n || `Player #${real.player_id}`);
  return `<li>
    <b>${i + 1}. ${esc(PROMPTS[pid].text)}<span class="tag ${tag}">${tag}</span></b>
    <div class="mine">${t ? `<span class="swatch ${t.cls}"></span><strong>${esc(s.pick)}</strong> · ${fmtPct(rateOf(state, i, s.id))}${live ? ' so far' : ''} · ${t.name} +${s.pts}` : '<span class="swatch brick"></span>Brick · 0'}</div>
    <dl>
      <dt>Most picked</dt><dd>${esc(top.n)} <i>${fmtPct(top.pct)}</i></dd>
      ${real ? `<dt>Deepest pull today</dt><dd>${esc(realName)} <i>${fmtPct(real.pct)} · ${real.picks} pick${real.picks > 1 ? 's' : ''}</i></dd>` : ''}
      <dt>Deepest answers</dt><dd>${deep3.map(d => `${esc(d.n)} <i>${fmtPct(d.pct)}</i>`).join(', ')}</dd>
    </dl>
    <div class="fine">${l.length} players fit${canReport() ? ` · <button class="link rep" type="button" data-report="${i}">Report a wrong answer</button>` : ''}</div>
  </li>`;
}

  const status = !live ? (state.mode === 'daily' ? 'Offline: scored on simulated pick rates.' : '')
    : state.settled ? 'Final score: pick rates are locked.'
    : `Live score from everyone's picks so far. Final rarity locks at midnight ET (${lock} your time).`;
  const total = state.slots.reduce((a,s)=>a+(s.pts||0),0);

    ${status ? `<div class="meta">${status}</div>` : ''}
    ${best ? `<div class="meta">Best pull: <strong>${esc(best.pick)}</strong>, picked by ${fmtPct(best.pct)} of players.</div>` : ''}
    ${b ? standingHTML(b) + curveHTML(b) : ''}
    ${saveCard()}
    <pre class="share" id="shareTxt">${esc(shareText())}</pre>
    ${state.mode === 'daily' ? `<div class="next" id="nextPack">${nextPackText()}</div>` : ''}
    <div class="actions"><button class="btn primary" id="copyBtn">Copy result</button>${TEST_MODE ? '<button class="btn" id="ripBtn2">Another test pack</button>' : ''}</div>
    <h3 class="rh">The reveal</h3>
    <ul class="recap">${state.prompts.map((pid, i) => revealHTML(i)).join('')}</ul>
  </div>`;
  $('copyBtn').addEventListener('click', async e => {

  $('ripBtn2')?.addEventListener('click', rip);
