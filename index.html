}
/* guests who finish the daily pack get a nudge to keep it */
function saveCard(){
  if (!isGuest() || state.mode !== 'daily') return '';
  try { if (localStorage.getItem('fromthelogo:saveDismissed') === state.date) return ''; } catch(e){}
  return `<div class="save"><b>Save your results</b>
    <span class="meta">Make an account to keep today's pack and all your guest packs, and start tracking streaks and stats.</span>
    <div class="actions"><button class="btn primary" id="saveBtn">Create account</button><button class="link" id="saveNo">Not now</button></div></div>`;
}

/* ---------- the shooter: every point of pull value pushes him further from the rim ---------- */
const totalPts = () => state.slots.reduce((a,s) => a + (s.pts||0), 0);
const distOf = pts => Math.max(2, pts);   // every point is a foot back: 0 = layup, 800 = 8.5 courts
function distLabel(d){
  if (d < 4) return 'Layup';
  if (d < 10) return 'Floater';
  if (d < 16) return 'Free throw line';
  if (d < 23.5) return 'Midrange';
  if (d < 30) return 'From three';
  if (d < 40) return 'Logo range';
  if (d < 50) return 'Half court';
  if (d < 86) return 'Past half court';
  if (d < 100) return 'Full court';
  return (d/94).toFixed(1) + ' courts back';
}

const Stage = (() => {
  const cv = $('court'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, ppf = 9, floorY = 0, clock = 0, last = 0, hudKey = '';
  const S = { px: 2, camX: -7, camY: 0, phase: 'idle', t: 0, queue: [], cur: null,
              ball: null, net: 0, netV: 0, pops: [], air: -1, walkPh: 0, hasBall: true };
  const C = { wood:'#7a5233', wood2:'#6a4529', line:'rgba(245,234,214,.75)', skin:'#efe2cc', jersey:'#e8b84a', ball:'#e2782c', seam:'#3a1d0c', board:'rgba(240,240,245,.9)', pole:'#3b3442', rim:'#e2562c', net:'rgba(245,240,230,.8)' };

  function size(){
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    floorY = H - 30;
    ppf = Math.min(W / 36, (floorY - 10) / 15.5);
  }
  const viewFt = () => W / ppf;
  const X = x => (x - S.camX) * ppf;
  const Y = y => floorY - (y - S.camY) * ppf;
  const ease = k => k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;

  function start(ev){
    S.cur = ev; S.t = 0;
    if (ev.type === 'walk') {
      S.from = S.px; S.to = ev.to;
      S.dur = Math.min(2600, 450 + Math.abs(S.to - S.from) * 14);
      S.phase = Math.abs(S.to - S.from) < 0.2 ? 'idle' : 'walk';
    } else { S.phase = 'windup'; }
  }
  function launch(){
    const x0 = S.px - 0.45, y0 = 7.3 + S.jump;
    const make = S.cur.make;
    const x1 = make ? 0 : 0.85, y1 = make ? 10.05 : 10.25;
    const dist = Math.abs(x0 - x1);
    S.ball = { x0, y0, x1, y1, h: Math.max(3.5, Math.min(60, dist * 0.38)), dur: Math.min(2300, 650 + dist * 6), x: x0, y: y0, rot: 0 };
    S.hasBall = false; S.phase = 'flight'; S.t = 0;
  }
  function pop(txt, col){ S.pops.push({ txt, col, t: 0 }); }

  function step(dt){
    clock += dt; S.t += dt;
    S.netV += -S.net * 0.18; S.netV *= 0.86; S.net += S.netV;
    if (S.air >= 0) { S.air += dt; S.jump = 1.5 * Math.sin(Math.min(1, S.air / 620) * Math.PI); if (S.air >= 620) { S.air = -1; S.jump = 0; } }
    S.pops.forEach(p => p.t += dt); S.pops = S.pops.filter(p => p.t < 1300);
    switch (S.phase) {
      case 'idle':
        S.hasBall = true;
        if (S.queue.length) start(S.queue.shift());
        break;
      case 'walk': {
        const k = Math.min(1, S.t / S.dur);
        S.px = S.from + (S.to - S.from) * ease(k);
        S.walkPh += dt * 0.017;
        if (k >= 1) S.phase = 'idle';
        break; }
      case 'windup':
        if (S.t >= 260) { S.phase = 'rise'; S.t = 0; S.air = 0; }
        break;
      case 'rise':
        if (S.t >= 240) launch();
        break;
      case 'flight': {
        const b = S.ball, s = Math.min(1, S.t / b.dur);
        b.x = b.x0 + (b.x1 - b.x0) * s;
        b.y = b.y0 + (b.y1 - b.y0) * s + 4 * b.h * s * (1 - s);
        b.rot -= dt * 0.012;
        if (s >= 1) {
          S.t = 0;
          if (S.cur.make) { S.phase = 'swish'; S.netV = 0.9; pop(S.cur.pts ? `SWISH +${S.cur.pts}` : 'SWISH', '#e8b84a'); }
          else { S.phase = 'brick'; b.bx = b.x; b.by = b.y; pop('BRICK', '#d9685c'); }
        }
        break; }
      case 'swish': {
        const b = S.ball, tt = S.t / 1000;
        b.x = 0; b.y = Math.max(0.4, 10.05 - 0.5 * 32 * tt * tt);
        if (S.t >= 700) { S.phase = 'hold'; S.t = 0; }
        break; }
      case 'brick': {
        const b = S.ball, s = Math.min(1, S.t / 650);
        b.x = b.bx + 4 * s; b.y = Math.max(0.4, b.by + (0.4 - b.by) * s + 4 * 3 * s * (1 - s));
        b.rot += dt * 0.01;
        if (s >= 1) { S.phase = 'hold'; S.t = 0; }
        break; }
      case 'hold':
        if (S.t >= 450) { S.ball = null; S.phase = 'idle'; }
        break;
    }
    // camera
    const vf = viewFt(), fits = S.px <= vf - 10;
    let target, k = 0.006;
    if (fits) target = -7;
    else if (S.phase === 'flight') { target = S.ball.x - vf * 0.5; k = 0.014; }
    else if (S.phase === 'swish' || S.phase === 'brick' || S.phase === 'hold') target = -7;
    else target = S.px - vf * 0.72;
    target = Math.max(-7, target);
    S.camX += (target - S.camX) * Math.min(1, dt * k);
    const ty = S.ball && S.phase === 'flight' ? Math.max(0, S.ball.y + 2.5 - floorY / ppf) : 0;
    S.camY += (ty - S.camY) * Math.min(1, dt * 0.01);
  }

  /* drawing */
  function line(x1,y1,x2,y2,w,col){ ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(X(x1),Y(y1)); ctx.lineTo(X(x2),Y(y2)); ctx.stroke(); }
  function drawBall(x, y, rot){
    const r = 0.4 * ppf, cx = X(x), cy = Y(y);
    ctx.fillStyle = C.ball; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = C.seam; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(rot)*r, cy + Math.sin(rot)*r); ctx.lineTo(cx - Math.cos(rot)*r, cy - Math.sin(rot)*r); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + Math.cos(rot+1.57)*r*1.4, cy + Math.sin(rot+1.57)*r*1.4, r*1.05, rot + 3.6, rot + 5.8); ctx.stroke();
  }
  function background(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1d1524'); g.addColorStop(1,'#0f0b13');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // crowd in the stands, slow parallax
    const off = S.camX * ppf * 0.25, top = Y(14) , rows = 5;
    for (let r = 0; r < rows; r++) {
      const yy = top + r * 9 + 8;
      if (yy > Y(0) - 4) break;
      for (let i = -1; i < W / 11 + 2; i++) {
        const x = ((i * 11 - off) % (W + 22) + W + 22) % (W + 22) - 11 + (r % 2) * 5;
        const h = ((i * 7 + r * 13) % 5);
        ctx.fillStyle = `rgba(239,232,220,${0.03 + h * 0.012})`;
        ctx.beginPath(); ctx.arc(x, yy, 2.4, 0, 7); ctx.fill();
      }
    }
    const spot = ctx.createRadialGradient(X(-1), Y(12), 0, X(-1), Y(12), 220);
    spot.addColorStop(0,'rgba(232,184,74,.10)'); spot.addColorStop(1,'rgba(232,184,74,0)');
    ctx.fillStyle = spot; ctx.fillRect(0,0,W,H);
  }
  function floor(){
    const fy = Y(0);
    ctx.fillStyle = C.wood; ctx.fillRect(0, fy, W, H - fy);
    ctx.fillStyle = C.wood2;
    for (let x = Math.floor(S.camX / 3) * 3; x < S.camX + viewFt() + 3; x += 3) {
      ctx.fillRect(X(x), fy + ((x/3) % 2 ? 6 : 14), 1, 6);
    }
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, fy, W, 2);
    // court markings repeat every 94 ft
    ctx.font = '600 9px "IBM Plex Mono", monospace'; ctx.textAlign = 'center';
    const lo = S.camX - 10, hi = S.camX + viewFt() + 10;
    for (let k = Math.max(0, Math.floor(lo / 94)); k * 94 - 6 < hi; k++) {
      const o = k * 94;
      const marks = [[-5.25, k === 0 ? 'BASELINE' : `${k} COURT${k>1?'S':''} BACK`],[13.75,'FT'],[23.75,'3PT'],[41.75,'HALF'],[59.75,''],[69.75,'']];
      if (k === 0) marks.push([88.75,'FULL COURT']);
      marks.forEach(([m, lbl]) => {
        const x = m + o; if (x < lo || x > hi) return;
        ctx.fillStyle = C.line; ctx.fillRect(X(x) - 1, fy, 2, 8);
        if (lbl) { ctx.fillStyle = 'rgba(245,234,214,.7)'; ctx.fillText(lbl, X(x), fy + 22); }
      });
      // center logo
      const cx = 41.75 + o;
      if (cx > lo && cx < hi) { ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(X(cx), fy + 4, 6 * ppf, 3, 0, 0, 7); ctx.stroke(); }
    }
  }
  function hoopBack(){
    line(-5.6, 0, -5.6, 12.6, 0.45 * ppf, C.pole);
    line(-5.6, 12.4, -1.3, 11.6, 0.25 * ppf, C.pole);
    ctx.fillStyle = C.board; ctx.fillRect(X(-1.4), Y(13.2), 0.22 * ppf, 3.6 * ppf);
  }
  function hoopFront(){
    const sway = S.net * 0.35;
    ctx.strokeStyle = C.net; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const xt = -0.75 + i * 0.375, xb = -0.45 + i * 0.225 + sway;
      ctx.beginPath(); ctx.moveTo(X(xt), Y(10)); ctx.lineTo(X(xb), Y(8.5 - Math.abs(sway) * 0.3)); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(X(-0.62), Y(9.3)); ctx.lineTo(X(0.62 + sway * 0.6), Y(9.3)); ctx.stroke();
    line(-1.2, 10, 0.78, 10, 0.16 * ppf, C.rim);
  }
  function player(){
    const x = S.px, j = S.jump;
    const crouch = S.phase === 'windup' ? Math.sin(Math.min(1, S.t / 260) * Math.PI / 2) * 0.55 : 0;
    const hipY = 3.3 + j - crouch, shY = 5.4 + j - crouch * 0.8, headY = 6.15 + j - crouch * 0.8;
    const walking = S.phase === 'walk';
    const sw = walking ? Math.sin(S.walkPh) * 0.75 : 0.28;
    const lift = walking ? Math.max(0, Math.cos(S.walkPh)) * 0.35 : 0;
    const lw = 0.36 * ppf;
    // legs
    [[sw, lift], [-sw, walking ? Math.max(0, -Math.cos(S.walkPh)) * 0.35 : 0]].forEach(([dx, up]) => {
      const fx = x + dx, fy = j + up;
      const kx = (x + fx) / 2 - 0.35, ky = (hipY + fy) / 2 + 0.1;
      line(x, hipY, kx, ky, lw, C.skin); line(kx, ky, fx, fy + 0.15, lw, C.skin);
      line(fx, fy + 0.12, fx - 0.45, fy + 0.12, lw * 0.9, '#fff');
    });
    // shorts + jersey
    line(x + 0.05, hipY + 0.1, x - 0.1, hipY + 0.9, 1.0 * ppf, '#2d2236');
    line(x, hipY + 0.6, x - 0.12, shY, 0.95 * ppf, C.jersey);
    // ball + arms
    let hand1, hand2, ballPos = null;
    const sh = [x - 0.12, shY - 0.1];
    if (S.hasBall && (S.phase === 'idle' || S.phase === 'walk')) {
      const by = 0.4 + Math.abs(Math.sin(clock * 0.0065)) * 2.3;
      ballPos = [x - 1.15, by];
      hand1 = [x - 1.1, Math.max(by + 0.45, 2.7)];
      hand2 = [x + 0.25, hipY + 0.1];
    } else if (S.phase === 'windup') {
      ballPos = [x - 0.75, 4.5 + j - crouch];
      hand1 = [x - 0.55, 4.3 + j - crouch]; hand2 = [x - 0.75, 4.1 + j - crouch];
    } else if (S.phase === 'rise') {
      const k = Math.min(1, S.t / 240);
      ballPos = [x - 0.75 + 0.3 * k, 4.5 + (7.3 - 4.5) * k + j];
      hand1 = [ballPos[0] + 0.15, ballPos[1] - 0.35]; hand2 = [ballPos[0] - 0.2, ballPos[1] - 0.2];
    } else if (S.phase === 'flight' && S.t < 450) {
      hand1 = [x - 0.9, 7.6 + j]; hand2 = [x - 0.75, 7.2 + j];
    } else {
      hand1 = [x - 0.2, hipY + 0.2]; hand2 = [x + 0.25, hipY + 0.1];
    }
    line(sh[0], sh[1], hand2[0], hand2[1], lw * 0.85, C.skin);
    ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(X(x - 0.18), Y(headY), 0.44 * ppf, 0, 7); ctx.fill();
    ctx.fillStyle = '#2d2236'; ctx.beginPath(); ctx.arc(X(x - 0.12), Y(headY + 0.12), 0.46 * ppf, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    if (ballPos) drawBall(ballPos[0], ballPos[1], clock * -0.004);
    line(sh[0], sh[1], hand1[0], hand1[1], lw * 0.85, C.skin);
  }
  function popups(){
    ctx.textAlign = 'center';
    S.pops.forEach(p => {
      const k = p.t / 1300;
      ctx.globalAlpha = 1 - k * k;
      ctx.fillStyle = p.col; ctx.font = '900 22px "Big Shoulders Display", Impact, sans-serif';
      ctx.fillText(p.txt, X(0), Y(12.6 + k * 2.5));
    });
    ctx.globalAlpha = 1;
  }
  function draw(){
    background(); floor(); hoopBack();
    if (S.ball && S.phase !== 'swish') drawBall(S.ball.x, S.ball.y, S.ball.rot);
    player();
    if (S.ball && S.phase === 'swish') drawBall(S.ball.x, S.ball.y, S.ball.rot);
    hoopFront(); popups();
    const key = Math.round(S.px) + '|' + distLabel(S.px);
    if (key !== hudKey) { hudKey = key; $('hudFt').textContent = Math.round(S.px) + ' FT'; $('hudLbl').textContent = distLabel(S.px); }
  }
  function frame(ts){
    const dt = Math.min(50, last ? ts - last : 16); last = ts;
    step(dt); draw();
    requestAnimationFrame(frame);
  }
  function snapCam(){ const vf = viewFt(); S.camX = S.px <= vf - 10 ? -7 : Math.max(-7, S.px - vf * 0.72); S.camY = 0; }

  size(); snapCam();
  addEventListener('resize', () => { size(); });
  $('stage').addEventListener('click', () => { if (S.phase === 'idle' && !S.queue.length && !reduce) S.queue.push({ type:'shoot', make:true }); });
  if (reduce) { draw(); addEventListener('resize', draw); } else requestAnimationFrame(frame);

  return {
    set(d){ S.px = d; S.queue = []; S.phase = 'idle'; S.ball = null; S.air = -1; S.jump = 0; S.pops = []; snapCam(); if (reduce) draw(); },
    pull(d, pts){ if (reduce) { S.px = d; snapCam(); draw(); return; } S.queue.push({ type:'walk', to:d }, { type:'shoot', make:true, pts }); },
    miss(){ if (!reduce) S.queue.push({ type:'shoot', make:false }); },
  };
})();

/* countdown to the next daily pack (midnight Eastern, by the server's clock) */
function nextPackText(){
  const mins = Math.max(0, Math.ceil((etStart(addDays(dayKey(), 1)) - nowMs()) / 60000));
  return mins ? `Next pack in ${Math.floor(mins / 60)}h ${mins % 60}m` : 'New pack is ready';
}
let countdown = null;
function armCountdown(){
  clearInterval(countdown);
  if (!$('nextPack')) return;
  countdown = setInterval(() => {
    const el = $('nextPack'); if (el) el.textContent = nextPackText(); else clearInterval(countdown);
  }, 15000);
}
/* at midnight ET the page loads the new pack by itself, unless you're mid-pack (that one can
   still finish in the grace minutes; the new pack loads once you're done) */
setInterval(() => {
  if (!state || state.mode !== 'daily' || state.date === dayKey()) return;
  const midPack = state.started && state.slots.some(s => s.status === 'open' || s.status === 'pending');
  if (!midPack) location.reload();
}, 10000);
function rip(){ if (!state || !TEST_MODE) return; setView('game'); state = freshState('unlimited', 'rip-' + Date.now() + Math.random()); state.started = true; lastPull = null; msg={text:'',bad:false}; Stage.set(distOf(0)); render(); window.scrollTo({top:0,behavior:'smooth'}); focusInput(); }
$('tabRip').addEventListener('click', rip);
if (TEST_MODE) { $('tabRip').hidden = false; $('tabRip').textContent = 'Test pack (not saved)'; }
async function openDaily(){
  let st = load() || freshState('daily', 'daily-' + dayKey());
  if (st.started === undefined) st.started = st.slots.some(s => s.status !== 'open');
  if (!st.online && st.mode === 'daily') await syncPack(st);   // keep retrying, even mid-pack
  await reconcileDay(st);
  save(st);
  return st;
}
$('tabStats').addEventListener('click', () => { if (state) showStats(); });
$('acctBtn').addEventListener('click', sheetAccount);
$('helpBtn').addEventListener('click', sheetHelp);
$('tabDaily').addEventListener('click', async () => {
  if (!state) return;
  setView('game');
  state = await openDaily(); lastPull = null; msg={text:'',bad:false}; Stage.set(distOf(totalPts())); render(); focusInput();
  flushUnsent(state); sendScore(state);
});

(async function boot(){
  $('page').innerHTML = '<div class="panel"><span class="meta">Loading players…</span></div>';
  setView('game');
  try { await Promise.all([loadPlayers(), initAuth()]); }
  catch (e) { $('page').innerHTML = `<div class="panel"><span class="meta">Couldn't load the player database. Refresh to try again.</span></div>`; $('foot').textContent = ''; return; }
  // Google account already had its own FromTheLogo account: log into that one; it claims the guest's packs on return
  if (urlErr?.code === 'identity_already_exists' && sb) { await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:here() } }); return; }
  if (urlErr) note(urlErr.code === 'access_denied' ? 'Google sign-in was cancelled.' : `Sign-in problem: ${esc(urlErr.msg || urlErr.code)}`, true);
  await syncClock();
  if (sb && !user) await sheetWelcome();
  await afterLogin();
  renderAccount();
  const modelRow = await loadModel();
  state = await openDaily();
  Stage.set(distOf(totalPts()));
  render();
  flushUnsent(state); sendScore(state); settlePast(); catchUpModel(modelRow);
})();
</script>
